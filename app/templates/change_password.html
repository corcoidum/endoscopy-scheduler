{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>비밀번호 변경</h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" class="form-stack">
    <label>현재 비밀번호 <input name="current_password" type="password" required></label>
    <label>새 비밀번호 <input name="new_password" type="password" minlength="10" required></label>
    <button class="button primary" type="submit">변경</button>
  </form>
</section>
{% endblock %}
