{% extends "base.html" %}
{% block content %}
<section class="page-title"><h1>검사 시간 및 정원 설정</h1></section>
<form method="post" class="panel form-grid">
  <label>요일
    <select name="weekday">
      <option value="0">월</option><option value="1">화</option><option value="2">수</option><option value="3">목</option><option value="4">금</option><option value="5">토</option><option value="6">일</option>
    </select>
  </label>
  <label>시작 시간 <input type="time" name="start_time" required></label>
  <label>최대 인원 <input type="number" name="max_capacity" min="1" max="10" value="1" required></label>
  <label>검사 종류 <input name="procedure_type" value="ANY"></label>
  <div class="wide"><button class="button primary" type="submit">추가</button></div>
</form>
<section class="panel">
  <table class="data-table">
    <thead><tr><th>요일</th><th>시간</th><th>정원</th><th>검사</th><th>활성</th></tr></thead>
    <tbody>
      {% for item in capacities %}
      <tr><td>{{ item.weekday }}</td><td>{{ item.start_time.strftime("%H:%M") }}</td><td>{{ item.max_capacity }}</td><td>{{ item.procedure_type }}</td><td>{{ item.is_active }}</td></tr>
      {% else %}
      <tr><td colspan="5" class="empty">설정된 정원이 없습니다.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
