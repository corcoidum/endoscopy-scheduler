{% extends "base.html" %}
{% block content %}
<section class="page-title"><h1>직원 계정 관리</h1></section>
<form method="post" class="panel form-grid">
  <label>아이디 <input name="username" required></label>
  <label>표시 이름 <input name="display_name" required></label>
  <label>역할
    <select name="role">
      {% for role in roles %}<option value="{{ role.value }}">{{ role.value }}</option>{% endfor %}
    </select>
  </label>
  <label>초기 비밀번호 <input name="password" type="password" minlength="10" required></label>
  <div class="wide"><button class="button primary" type="submit">계정 생성</button></div>
</form>
<section class="panel">
  <table class="data-table">
    <thead><tr><th>아이디</th><th>이름</th><th>역할</th><th>활성</th><th>작업</th></tr></thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.display_name }}</td>
        <td>{{ user.role }}</td>
        <td>{{ "활성" if user.is_active else "비활성" }}</td>
        <td class="actions">
          {% if user.is_active and user.id != current_user.id %}
          <form method="post" action="/admin/users/{{ user.id }}/deactivate"><button class="button small danger" type="submit">비활성화</button></form>
          {% endif %}
          <form method="post" action="/admin/users/{{ user.id }}/reset-password" class="inline-form">
            <input name="password" type="password" minlength="10" placeholder="새 임시 비밀번호" required>
            <button class="button small" type="submit">초기화</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
